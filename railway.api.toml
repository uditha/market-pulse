[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @lankapulse/shared build && pnpm --filter @lankapulse/db build && pnpm --filter @lankapulse/api build"

[deploy]
preDeployCommand = "pnpm db:migrate && pnpm db:seed"
startCommand = "pnpm --filter @lankapulse/api start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
