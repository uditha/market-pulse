[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @lankapulse/shared build && pnpm --filter @lankapulse/web build"

[deploy]
startCommand = "pnpm --filter @lankapulse/web start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
